<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingreso · Pochoclo Club</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #0b0b0b; color: #f4f1ea; font-family: Georgia, serif; }
      main { min-height: 100vh; display: grid; place-content: center; gap: 1rem; padding: 2rem 1.2rem; text-align: center; }
      p { margin: 0; color: rgba(244,241,234,0.62); }
      .kicker { font-family: system-ui, sans-serif; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.04em; }
      .error { color: #ff7a6e; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Pochoclo Club</p>
      <h1>Entrando con Google…</h1>
      <p id="status">Esperá un segundo.</p>
    </main>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import {
        GoogleAuthProvider,
        getAuth,
        getRedirectResult,
        inMemoryPersistence,
        setPersistence,
        signInWithPopup,
        signInWithRedirect,
      } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const returnTo = params.get("return") || "";
      const invite = params.get("invite") || "";
      const allowed =
        returnTo.startsWith("https://pochoclo.club/") ||
        returnTo.startsWith("https://www.pochoclo.club/");

      function fail(message) {
        status.className = "error";
        status.textContent = message;
      }

      function goBack(hash) {
        const url = new URL(allowed ? returnTo : "https://pochoclo.club/auth/complete");
        url.hash = hash;
        location.replace(url.toString());
      }

      if (!allowed) {
        fail("El destino de ingreso no es válido.");
      } else {
        const app = initializeApp({
          apiKey: "AIzaSyCGYUd1YgKOI79ONOvy4nC6kgCfSHg-Fpo",
          authDomain: "pochoclo-club.firebaseapp.com",
          projectId: "pochoclo-club",
          appId: "1:274140905514:web:aa9c8561f1f7d650838353",
        });
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        async function finish(credential) {
          const idToken = await credential.user.getIdToken();
          const hash = new URLSearchParams({ idToken });
          if (invite) hash.set("invite", invite);
          goBack(hash.toString());
        }

        try {
          await setPersistence(auth, inMemoryPersistence);
          const redirected = await getRedirectResult(auth);
          if (redirected) {
            await finish(redirected);
          } else {
            try {
              const popped = await signInWithPopup(auth, provider);
              await finish(popped);
            } catch {
              status.textContent = "Continuá en Google…";
              await signInWithRedirect(auth, provider);
            }
          }
        } catch (error) {
          fail("Google no pudo completar el acceso. Volvé a pochoclo.club e intentá otra vez.");
          console.error(error);
        }
      }
    </script>
  </body>
</html>
